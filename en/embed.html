<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today’s flag | Flag Master</title>
<meta name="description" content="A one-question-a-day flag quiz from Flag Master that you can embed on your blog or website (4 choices: flags and country names).">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://chikokunn1011.github.io/country-drill/en/">
<script>
// 色は貼る人が ?theme= で決める（端末のデータは読まない）。'dark' はダーク、'auto' は data-theme を付けず端末に合わせる、ほかはライト
try { const t = new URLSearchParams(location.search).get('theme'); if (t !== 'auto') document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'; } catch {}
</script>
<style>
/* 色とフォントの変数は index.html と同じ値（単独で動くページなので写す。tests/unit/pages.test.mjs で比べる） */
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --ink: #1b2a33;
  --muted: #5b6b73;
  --line: #d3dcdc;
  --accent: #1f5f8b;
  --accent-ink: #ffffff;
  --ok: #2e8b57;
  --ok-soft: #e1f2e8;
  --ng: #c43d3d;
  --ng-soft: #f8e3e3;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171c; --surface: #18232a; --ink: #e5edf0; --muted: #93a4ac; --line: #2c3a42;
    --accent: #6fb3e0; --accent-ink: #0c1820; --ok: #5cc48a; --ok-soft: #173326;
    --ng: #ec7a7a; --ng-soft: #3a1d1f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171c; --surface: #18232a; --ink: #e5edf0; --muted: #93a4ac; --line: #2c3a42;
  --accent: #6fb3e0; --accent-ink: #0c1820; --ok: #5cc48a; --ok-soft: #173326;
  --ng: #ec7a7a; --ng-soft: #3a1d1f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  margin: 0; padding: 12px; overflow-x: clip; overflow-wrap: anywhere;
}
#embed { max-width: 400px; margin: 0 auto; }
h1 { font-family: var(--font-display); font-size: 17px; margin: 0 0 2px; color: var(--accent); }
#e-q { margin: 0 0 6px; font-size: 14px; color: var(--muted); }
#e-prompt { display: flex; justify-content: center; min-height: 32px; margin-bottom: 8px; font-family: var(--font-display); font-size: 22px; font-weight: 700; text-align: center; }
#e-prompt img { width: min(100%, 150px); aspect-ratio: 4 / 3; object-fit: contain; border: 1px solid var(--line); background: var(--surface); }
#e-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.e-opt {
  min-width: 0; min-height: 44px; padding: 6px; border: 2px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center; overflow-wrap: anywhere;
}
.e-opt:hover:enabled, .e-opt:focus-visible { border-color: var(--accent); }
.e-opt:disabled { cursor: default; }
.e-opt img { width: min(100%, 112px); aspect-ratio: 4 / 3; object-fit: contain; display: block; }
.e-opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.e-opt.ng { border-color: var(--ng); background: var(--ng-soft); }
.e-noflag { display: flex; align-items: center; justify-content: center; width: min(100%, 150px); aspect-ratio: 4 / 3; padding: 4px; font-size: 12px; font-weight: 500; color: var(--muted); border: 1px dashed var(--line); text-align: center; }
.e-opt .e-noflag { width: min(100%, 112px); }
#e-msg { min-height: 1.5em; margin: 6px 0 2px; font-weight: 700; }
#e-msg.ok { color: var(--ok); }
#e-msg.ng { color: var(--ng); }
#e-links { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; }
#e-links a { color: var(--accent); }
#e-again { margin-top: 6px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; }
.e-err { color: var(--ng); font-weight: 700; }
footer { max-width: 400px; margin: 8px auto 0; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<main id="embed">
  <h1>Today’s flag</h1>
  <p id="e-q"></p>
  <div id="e-prompt"></div>
  <div id="e-opts"></div>
  <p id="e-msg" role="status"></p>
  <div id="e-links" hidden>
    <a id="e-daily" href="en/#daily" target="_blank" rel="noopener">Try the Daily Puzzle (20 questions)</a>
    <a id="e-more" href="en/" target="_blank" rel="noopener">Play more</a>
  </div>
  <button type="button" id="e-again" hidden>Try again</button>
</main>
<footer>Flags: flag-icons (MIT)</footer>
<script src="i18n.js?v=4"></script>
<script src="i18n/en-embed.js?v=1"></script>
<script src="countries.js?v=2"></script>
<script src="daily-core.js?v=2"></script>
<script src="embed.js?v=2"></script>
</body>
</html>
