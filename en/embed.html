<!doctype html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today’s flag | Flag Master</title>
<meta name="description" content="A one-question-a-day flag quiz from Flag Master that you can embed on your blog or website (4 choices: flags and country names).">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://chikokunn1011.github.io/country-drill/en/">
<script>
// 色は貼る人が ?theme= で決める（端末のデータは読まない）。'dark' はダーク、'auto' は data-theme を付けず端末に合わせる、ほかはライト
try { const t = new URLSearchParams(location.search).get('theme'); if (t !== 'auto') document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'; } catch {}
</script>
<style>
/* 色とフォントの変数は index.html と同じ値（単独で動くページなので写す。tests/unit/pages.test.mjs で比べる） */
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --ink: #1b2a33;
  --muted: #5b6b73;
  --line: #d3dcdc;
  --accent: #1f5f8b;
  --accent-ink: #ffffff;
  --hl: #e39b2d;
  --ok: #2e8b57;
  --ok-soft: #e1f2e8;
  --ng: #c43d3d;
  --ng-soft: #f8e3e3;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171c; --surface: #18232a; --ink: #e5edf0; --muted: #93a4ac; --line: #2c3a42;
    --accent: #6fb3e0; --accent-ink: #0c1820; --hl: #f0b04a; --ok: #5cc48a; --ok-soft: #173326;
    --ng: #ec7a7a; --ng-soft: #3a1d1f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171c; --surface: #18232a; --ink: #e5edf0; --muted: #93a4ac; --line: #2c3a42;
  --accent: #6fb3e0; --accent-ink: #0c1820; --hl: #f0b04a; --ok: #5cc48a; --ok-soft: #173326;
  --ng: #ec7a7a; --ng-soft: #3a1d1f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  margin: 0; padding: 8px; overflow-x: clip; overflow-wrap: anywhere;
}
/* カード: 上の帯はアイコンの4色（国旗の型） */
#embed {
  position: relative; max-width: 400px; margin: 0 auto; padding: 14px 12px 10px; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: 0 6px 18px -10px rgb(0 0 0 / .35);
}
#embed::before {
  content: ""; position: absolute; inset: 0 0 auto; height: 5px;
  background: linear-gradient(90deg, #1f5f8b 0 25%, #2e8b57 25% 50%, #e39b2d 50% 75%, #c43d3d 75%);
}
#e-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
#e-brand { display: flex; align-items: center; gap: 8px; min-width: 0; color: inherit; text-decoration: none; }
#e-brand svg { flex: none; width: 30px; height: 30px; border-radius: 8px; }
#e-brand small { display: block; font-size: 11px; line-height: 1.2; color: var(--muted); font-weight: 700; letter-spacing: .02em; }
#e-brand:hover small, #e-brand:focus-visible small { color: var(--accent); text-decoration: underline; }
h1 { font-family: var(--font-display); font-size: 17px; line-height: 1.2; margin: 0; color: var(--accent); }
#e-day {
  margin-left: auto; flex: none; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700;
  color: var(--ink); background: color-mix(in srgb, var(--hl) 22%, var(--surface)); border: 1px solid color-mix(in srgb, var(--hl) 55%, var(--surface));
}
#e-day:empty { display: none; }
#e-next { margin-left: auto; flex: none; font-size: 12px; font-weight: 700; color: var(--muted); text-align: right; line-height: 1.3; }
#e-next:not([hidden]) + #e-day { display: none; }
#e-q { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); text-align: center; }
#e-prompt { display: flex; justify-content: center; min-height: 32px; margin: 2px 0 6px; font-family: var(--font-display); font-size: 23px; font-weight: 700; line-height: 1.3; text-align: center; }
#e-prompt img { width: min(100%, 132px); aspect-ratio: 4 / 3; object-fit: contain; border-radius: 6px; background: var(--surface); box-shadow: 0 0 0 1px var(--line), 0 6px 14px -8px rgb(0 0 0 / .45); }
#e-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.e-opt {
  position: relative; min-width: 0; min-height: 44px; padding: 4px 6px; border: 2px solid var(--line); border-radius: 12px;
  background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; line-height: 1.3; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center; overflow-wrap: anywhere;
  box-shadow: 0 2px 0 var(--line); transition: transform .12s, box-shadow .12s, border-color .12s;
}
.e-opt:hover:enabled, .e-opt:focus-visible { border-color: var(--accent); box-shadow: 0 3px 0 var(--accent); transform: translateY(-1px); }
.e-opt:active:enabled { transform: translateY(1px); box-shadow: 0 1px 0 var(--accent); }
.e-opt:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }
.e-opt:disabled { cursor: default; }
.e-opt img { width: min(100%, 88px); aspect-ratio: 4 / 3; object-fit: contain; display: block; }
.e-opt.ok { border-color: var(--ok); background: var(--ok-soft); box-shadow: 0 2px 0 var(--ok); animation: e-pop .45s ease-out; }
.e-opt.ng { border-color: var(--ng); background: var(--ng-soft); box-shadow: 0 2px 0 var(--ng); animation: e-shake .35s; }
.e-opt.ng img { opacity: .55; }
.e-opt.ok::after, .e-opt.ng::after {
  position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center; font-size: 13px; line-height: 1; color: #fff;
}
.e-opt.ok::after { content: "✓"; background: var(--ok); }
.e-opt.ng::after { content: "✗"; background: var(--ng); }
.e-opt.ok, .e-opt.ng { overflow: visible; }
.e-noflag { display: flex; align-items: center; justify-content: center; width: min(100%, 150px); aspect-ratio: 4 / 3; padding: 4px; font-size: 12px; font-weight: 500; color: var(--muted); border: 1px dashed var(--line); text-align: center; }
.e-opt .e-noflag { width: min(100%, 88px); }
#e-res { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2px 10px; min-height: 30px; margin: 4px 0; }
#e-msg { margin: 0; font-family: var(--font-display); font-size: 16px; font-weight: 700; text-align: center; }
#e-msg.ok { color: var(--ok); animation: e-pop .4s ease-out; }
#e-msg.ng { color: var(--ng); }
/* 答えたあとの「もっと遊ぶ」 */
#e-links { animation: e-rise .35s ease-out; }
#e-more {
  display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 12px;
  border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 700; text-decoration: none; text-align: center;
  box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 60%, #000);
}
#e-more:hover, #e-more:focus-visible { filter: brightness(1.08); }
#e-more:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }
#e-more .e-arrow { display: inline-block; animation: e-nudge 1.4s ease-in-out infinite; }
#e-sub { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0 14px; margin-top: 6px; font-size: 13px; line-height: 1.4; }
#e-sub a { color: var(--accent); font-weight: 700; }
#e-again { padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font: inherit; font-size: 12px; cursor: pointer; }
#e-again:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }
.e-err { color: var(--ng); font-weight: 700; }
/* 正解の紙ふぶき（アイコンの4色） */
.e-bit { position: absolute; width: 7px; height: 10px; border-radius: 2px; pointer-events: none; animation: e-fall 1.1s ease-in forwards; }
footer { max-width: 400px; margin: 2px auto 0; font-size: 10px; color: var(--muted); text-align: right; }
@keyframes e-pop { 0% { transform: scale(.94); } 55% { transform: scale(1.05); } 100% { transform: scale(1); } }
@keyframes e-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@keyframes e-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes e-nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
@keyframes e-fall { from { transform: translate(0, 0) rotate(0); opacity: 1; } to { transform: translate(var(--dx), 140px) rotate(var(--rot)); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .e-bit { display: none; }
}
</style>
</head>

  <div id="e-head">

      <div><small>Flag Master</small><h1>Today’s flag</h1></div>

    <span id="e-next" hidden></span>
    <span id="e-day"></span>
  </div>
  <p id="e-q"></p>
