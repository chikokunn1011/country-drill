<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="国旗・国名・場所を4択クイズで覚える、195か国の学習サイト。">
<title>195か国ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 地図帳の1ページ。ホーム→モード選択→出題カード。地図は選んだ地域に合わせて切り出す */
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --ink: #1b2a33;
  --muted: #5b6b73;
  --line: #d3dcdc;
  --accent: #1f5f8b;
  --accent-ink: #ffffff;
  --hl: #e39b2d;
  --ok: #2e8b57;
  --ok-soft: #e1f2e8;
  --ng: #c43d3d;
  --ng-soft: #f8e3e3;
  --ocean: #d5e6ec;
  --land: #f4f6ef;
  --border-land: #b9c6c4;
  /* テクスチャ（textures/ フォルダ） */
  --grain: #2b3a33; --grain-op: .1;
  --contour: #1f5f8b; --contour-op: .2;
  --tex-ocean: url("textures/ocean-light.svg");
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171c; --surface: #18232a; --ink: #e5edf0; --muted: #93a4ac; --line: #2c3a42;
    --accent: #6fb3e0; --accent-ink: #0c1820; --hl: #f0b04a; --ok: #5cc48a; --ok-soft: #173326;
    --ng: #ec7a7a; --ng-soft: #3a1d1f; --ocean: #142b38; --land: #2a3a40; --border-land: #45575e;
    --grain: #ffffff; --grain-op: .045; --contour: #6fb3e0; --contour-op: .16; --tex-ocean: url("textures/ocean-dark.svg");
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171c; --surface: #18232a; --ink: #e5edf0; --muted: #93a4ac; --line: #2c3a42;
  --accent: #6fb3e0; --accent-ink: #0c1820; --hl: #f0b04a; --ok: #5cc48a; --ok-soft: #173326;
  --ng: #ec7a7a; --ng-soft: #3a1d1f; --ocean: #142b38; --land: #2a3a40; --border-land: #45575e;
  --grain: #ffffff; --grain-op: .045; --contour: #6fb3e0; --contour-op: .16; --tex-ocean: url("textures/ocean-dark.svg");
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px; overflow-x: clip;
}
/* 地図帳の紙の繊維。画面全体に薄く敷く */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: var(--grain); opacity: var(--grain-op);
  -webkit-mask: url("textures/paper.svg") repeat; mask: url("textures/paper.svg") repeat;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button { font-family: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }

/* 共通パーツ */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 900; font-size: 1.1rem; letter-spacing: .02em; background: none; border: 0; color: var(--ink); padding: 0; cursor: pointer; }
.brand small { display: block; font-family: var(--font-mono); font-weight: 400; font-size: .62rem; color: var(--muted); letter-spacing: .12em; }
.linkbtn { background: none; border: 0; color: var(--accent); font: 700 .9rem var(--font-display); cursor: pointer; padding: 4px 8px; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 12px 26px; font: 700 1.05rem var(--font-display); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 14px; font-size: .9rem; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.chip:disabled { opacity: .45; cursor: default; }
.chip .mono { font-size: .72rem; opacity: .75; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.panel h2 { font-family: var(--font-display); font-weight: 900; font-size: 1.25rem; margin: 0; text-wrap: balance; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .field > .lbl { font-size: .78rem; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.hint { font-size: .82rem; color: var(--muted); margin: 0; }
select { font: inherit; font-size: .92rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: .95rem; cursor: pointer; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); }
.field > label.switch { font-size: .95rem; letter-spacing: 0; color: var(--ink); font-weight: 500; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.row.center { justify-content: center; }
.mono { font-family: var(--font-mono); font-size: .85rem; font-variant-numeric: tabular-nums; }

/* ホーム */
.home { position: relative; isolation: isolate; text-align: center; padding-block: 36px 24px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
/* ホームの背景に等高線。端はぼかして紙になじませる */
.home::before {
  content: ""; position: absolute; z-index: -1; pointer-events: none; top: -20px; bottom: -40px; left: 50%; width: 100vw; transform: translateX(-50%);
  background: var(--contour); opacity: var(--contour-op);
  -webkit-mask: url("textures/contour.svg") center / max(1200px, 100%) auto no-repeat, radial-gradient(closest-side, #000 55%, transparent);
  -webkit-mask-composite: source-in;
  mask: url("textures/contour.svg") center / max(1200px, 100%) auto no-repeat, radial-gradient(closest-side, #000 55%, transparent);
  mask-composite: intersect;
}
.home .eyebrow { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .18em; color: var(--muted); margin: 0; }
.home h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(2.4rem, 9vw, 3.6rem); line-height: 1.1; margin: 0; text-wrap: balance; }
.home .flags { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; max-width: 420px; }
.home .flags img { width: 36px; aspect-ratio: 4/3; border-radius: 3px; border: 1px solid var(--line); object-fit: cover; }
.home .menu { display: flex; flex-direction: column; gap: 10px; width: min(280px, 100%); }
.home .menu .btn { padding: 15px; font-size: 1.2rem; }

/* モード選択 */
.modegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modecard { border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 12px 14px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.modecard b { font-family: var(--font-display); font-size: 1rem; }
.modecard span { font-size: .78rem; color: var(--muted); }
.modecard[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.kind { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* クイズ */
.progress { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: .8rem; color: var(--muted); gap: 12px; flex-wrap: wrap; }
.bar { flex: 1 1 120px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.streak { color: var(--hl); font-weight: 500; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 18px; align-items: center; }
.qlabel { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; text-align: center; margin: 0; text-wrap: balance; }
.qflag { width: min(280px, 70%); aspect-ratio: 4/3; max-width: 100%; border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 2px 10px rgb(0 0 0 / .08); object-fit: cover; }
.qbig { font-family: var(--font-display); font-weight: 900; font-size: clamp(1.8rem, 6vw, 2.6rem); text-align: center; line-height: 1.25; margin: 0; }
.qsub { color: var(--muted); font-size: .85rem; margin: -10px 0 0; }
.mapbox { width: 100%; position: relative; }
.map { width: 100%; aspect-ratio: 16/9; max-width: 100%; background: var(--ocean) var(--tex-ocean); background-size: 288px auto; border-radius: 10px; display: block; }
.map path { fill: var(--land); stroke: var(--border-land); stroke-width: .5; vector-effect: non-scaling-stroke; }
.map path.on { fill: var(--hl); stroke: var(--ink); stroke-width: .8; }
.map circle.ring { fill: none; stroke: var(--hl); stroke-width: 3; vector-effect: non-scaling-stroke; }
.map .graticule { fill: none; stroke: var(--border-land); stroke-width: .3; stroke-dasharray: 2 3; }
.map.zoomable { cursor: grab; }
.zoomctl { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 4px; }
.zoomctl button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 700 1rem var(--font-mono); cursor: pointer; }
.zoomctl button.reset { width: auto; padding: 0 10px; font-size: .75rem; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.choice { position: relative; display: flex; align-items: center; gap: 10px; text-align: left; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 12px 14px; font-size: 1rem; font-weight: 500; cursor: pointer; min-height: 56px; min-width: 0; transition: border-color .15s, transform .1s; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice:active:not(:disabled) { transform: scale(.98); }
.choice kbd { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; flex: none; }
.choice span { min-width: 0; overflow-wrap: anywhere; }
.choice.ok { border-color: var(--ok); background: var(--ok-soft); }
.choice.ng { border-color: var(--ng); background: var(--ng-soft); }
.choice:disabled { cursor: default; }
.choice.flagc, .choice.mapc { flex-direction: column; align-items: stretch; padding: 10px; gap: 6px; }
.choice.flagc kbd, .choice.mapc kbd { align-self: flex-start; }
.choice.flagc img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); }
.choice.mapc .map { aspect-ratio: 4/3; border-radius: 6px; background-size: 192px auto; }
.choice .cname { text-align: center; font-size: .9rem; font-weight: 600; line-height: 1.3; }
.reveal { width: 100%; border-top: 1px dashed var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.verdict { font-family: var(--font-display); font-weight: 900; font-size: 1.2rem; margin: 0; }
.verdict.ok { color: var(--ok); } .verdict.ng { color: var(--ng); }
.facts { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
.facts img { width: 96px; aspect-ratio: 4/3; border: 1px solid var(--line); border-radius: 4px; object-fit: cover; }
.facts dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; min-width: 0; }
.facts dt { color: var(--muted); font-size: .78rem; letter-spacing: .06em; align-self: center; }
.facts dd { margin: 0; font-weight: 500; min-width: 0; }
.facts .name { font-family: var(--font-display); font-weight: 900; font-size: 1.3rem; grid-column: 1 / -1; }
.next { align-self: flex-end; }

/* 結果 */
.result { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.score { font-family: var(--font-display); font-weight: 900; font-size: 3.4rem; line-height: 1; margin: 0; }
.score small { font-size: 1.2rem; color: var(--muted); }
.stats { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; font-size: .9rem; color: var(--muted); }
.stats b { color: var(--ink); font-family: var(--font-mono); }
.misslist { list-style: none; margin: 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 6px; }
.misslist li { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; }
.misslist img { width: 48px; aspect-ratio: 4/3; border-radius: 3px; border: 1px solid var(--line); object-fit: cover; }

/* 図鑑 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; text-align: left; color: var(--ink); min-width: 0; }
.card:hover { border-color: var(--accent); }
.card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); }
.card b { font-family: var(--font-display); font-size: .95rem; line-height: 1.3; }
.card span { font-size: .78rem; color: var(--muted); line-height: 1.3; }
.grid.hide-cap .card span { visibility: hidden; }
.count { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
.seg { display: inline-flex; border: 1.5px solid var(--accent); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--accent); font: 700 .88rem var(--font-display); padding: 6px 16px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
/* 図鑑の地図：国をタップすると右（スマホは下）に情報が出る */
.bmap { display: flex; flex-direction: column; gap: 12px; }
.bmap .map path.pick { cursor: pointer; }
.bmap .map path.pick:hover { fill: color-mix(in srgb, var(--hl) 35%, var(--land)); }
.bmap .map path.dim { fill: color-mix(in srgb, var(--land) 55%, var(--ocean)); }
.bmap .map path.match { fill: color-mix(in srgb, var(--accent) 35%, var(--land)); }
.bmap .map path.on, .bmap .map path.on:hover { fill: var(--hl); stroke: var(--ink); stroke-width: .8; }
.bmap .map .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; pointer-events: none; }
.bmap .map .dot.match { fill: color-mix(in srgb, var(--accent) 35%, var(--surface)); }
.bmap .map .dot.on { fill: var(--hl); stroke: var(--ink); }
.bmap .map .hit { fill: transparent; cursor: pointer; }
.bmap .map { aspect-ratio: 16/9; }
.binfo { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-height: 120px; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.binfo .hint { text-align: center; }
input[type="search"] { font: inherit; font-size: .9rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }

dialog { border: 0; border-radius: 16px; padding: 0; background: var(--surface); color: var(--ink); width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgb(0 0 0 / .45); }
dialog .inner { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
dialog .close { align-self: flex-end; background: transparent; border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 4px 12px; cursor: pointer; }
footer { font-size: .75rem; color: var(--muted); text-align: center; }

@media (max-width: 480px) {
  .choices { grid-template-columns: 1fr 1fr; }
  .choices.textc { grid-template-columns: 1fr; }
  .qcard { padding: 16px; }
  .facts { grid-template-columns: 72px 1fr; } .facts img { width: 72px; }
  .modegrid, .kind { grid-template-columns: 1fr; }
}
/* PC：広い画面を使う。スマホ幅はここに入らない */
.cols, .col { display: flex; flex-direction: column; gap: 14px; }
.qmain { display: flex; flex-direction: column; gap: 18px; align-items: center; width: 100%; }
.home .flags img:nth-child(n+15) { display: none; }
/* PCレイアウト（900px以上）は pc.css。スマホ幅では読み込まれても適用されない */
.rslot { display: none; }
.rside { display: contents; }
/* ドパガキ向け：設定でONにしたときだけ。色を派手にして、正解のたびに光る・鳴る・飛ぶ */
body.dopa { --accent: #ff1f7a; --accent-ink: #ffffff; --hl: #ffc400; --ok: #00b84a; --ok-soft: #d6ffe4; --ng: #ff3b30; --ng-soft: #ffe0de; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) body.dopa { --accent: #ff4f9a; --accent-ink: #1a0010; --hl: #ffd400; --ok: #2bff88; --ok-soft: #0c3a22; --ng: #ff5a52; --ng-soft: #3d1414; }
}
:root[data-theme="dark"] body.dopa { --accent: #ff4f9a; --accent-ink: #1a0010; --hl: #ffd400; --ok: #2bff88; --ok-soft: #0c3a22; --ng: #ff5a52; --ng-soft: #3d1414; }
body.dopa .btn:not(.ghost) { background: linear-gradient(120deg, #ff1f7a, #ff7a00, #ffc400, #ff1f7a); background-size: 300% 100%; color: #fff; animation: dopa-grad 3s linear infinite; box-shadow: 0 4px 0 rgb(120 0 50 / .35); text-shadow: 0 1px 2px rgb(0 0 0 / .3); }
body.dopa .btn:not(.ghost):active { transform: translateY(3px); box-shadow: 0 1px 0 rgb(120 0 50 / .35); }
body.dopa .bar { height: 12px; border-radius: 6px; }
body.dopa .bar i { background: linear-gradient(90deg, #ff1f7a, #ff7a00, #ffc400, #00e676, #00b0ff, #d500f9, #ff1f7a); background-size: 200% 100%; animation: dopa-grad 1.2s linear infinite; }
body.dopa .qcard { border: 2px solid var(--accent); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 18%, transparent), 0 10px 30px color-mix(in srgb, var(--accent) 22%, transparent); }
body.dopa .choice { border-width: 2px; }
body.dopa .choice:hover:not(:disabled) { transform: translateY(-2px) scale(1.02); box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 30%, transparent); }
body.dopa .choice.ok { animation: dopa-boom .55s cubic-bezier(.3, 1.8, .5, 1); box-shadow: 0 0 0 4px var(--ok), 0 0 28px var(--ok); }
body.dopa .choice.ng { animation: dopa-shake .4s; }
body.dopa .verdict { font-size: 1.8rem; }
body.dopa .verdict.ok { background: linear-gradient(90deg, #ff1f7a, #ff7a00, #ffc400); -webkit-background-clip: text; background-clip: text; color: transparent; animation: dopa-boom .5s cubic-bezier(.3, 1.8, .5, 1); }
body.dopa .streak { font: 900 1.05rem var(--font-display); color: var(--accent); }
body.dopa .streak.hot { display: inline-block; animation: dopa-pulse .6s ease-in-out infinite; }
.pts { display: none; font: 900 1.05rem var(--font-mono); color: var(--hl); text-shadow: 0 1px 0 rgb(0 0 0 / .25); }
body.dopa .pts { display: inline; }
body.dopa .result .pts { display: block; font-size: 1.6rem; margin: 0; }
.qcard.shake { animation: dopa-shake .45s; }
.fx-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1000; pointer-events: none; }
.fx-pop { position: fixed; left: 50%; top: 36%; z-index: 1001; pointer-events: none; white-space: nowrap; font: 900 clamp(2.2rem, 10vw, 4.6rem) var(--font-display); color: #fff; -webkit-text-stroke: 3px #1b0030; paint-order: stroke fill; text-shadow: 0 0 24px #ff1f7a, 0 6px 0 #ffc400; animation: fx-pop 1.1s cubic-bezier(.2, 1.6, .4, 1) forwards; }
.fx-pop.small { font-size: clamp(1.6rem, 7vw, 2.8rem); }
.fx-pop.bad { text-shadow: 0 0 20px #ff3b30; color: #ffd6d3; }
.fx-pts { position: fixed; z-index: 1001; pointer-events: none; font: 900 1.7rem var(--font-mono); color: #ffc400; -webkit-text-stroke: 2px #1b0030; paint-order: stroke fill; animation: fx-rise 1s ease-out forwards; }
.fx-flash { position: fixed; inset: 0; z-index: 999; pointer-events: none; animation: fx-flash .4s ease-out forwards; }
.rank { font: 900 3.6rem/1 var(--font-display); margin: 0; background: linear-gradient(135deg, #ff1f7a, #ff7a00, #ffc400); -webkit-background-clip: text; background-clip: text; color: transparent; animation: dopa-boom .8s cubic-bezier(.3, 1.8, .5, 1); }
@keyframes dopa-grad { to { background-position: 300% 0; } }
@keyframes dopa-boom { 0% { transform: scale(.7); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes dopa-shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px) rotate(-1deg); } 40% { transform: translateX(9px) rotate(1deg); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
@keyframes dopa-pulse { 50% { transform: scale(1.18); } }
@keyframes fx-pop { 0% { transform: translate(-50%, -50%) scale(.2) rotate(-12deg); opacity: 0; } 25% { transform: translate(-50%, -50%) scale(1.15) rotate(3deg); opacity: 1; } 70% { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; } 100% { transform: translate(-50%, -80%) scale(.9); opacity: 0; } }
@keyframes fx-rise { 0% { transform: translate(-50%, 0) scale(.6); opacity: 0; } 20% { transform: translate(-50%, -10px) scale(1.2); opacity: 1; } 100% { transform: translate(-50%, -70px) scale(1); opacity: 0; } }
@keyframes fx-flash { from { opacity: 1; } to { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="countries.js"></script>
<script src="flags.js"></script>
<script src="world.js"></script>
<script>
/* ---------- データ ---------- */
const C = window.COUNTRIES;
const byA = new Map(C.map(c => [c.a, c]));
const feats = topojson.feature(WORLD, WORLD.objects.countries).features;
const featById = new Map();
for (const f of feats) { const k = String(f.id), prev = featById.get(k); if (!prev || d3.geoArea(f) > d3.geoArea(prev)) featById.set(k, f); } // 同じIDが複数ある国（豪州と周辺の島）は本土を代表にする
const featOf = c => featById.get(c.a === 'xk' ? 'XK' : c.id);
const flagCache = {};
const flag = a => flagCache[a] ||= 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(FLAGS[a]);
const REGIONS = ['アジア', 'ヨーロッパ', 'アフリカ', '北・中央アメリカ', '南アメリカ', 'オセアニア'];
// 地域ごとの地図の切り出し範囲 [西経度, 南緯度, 東経度, 北緯度]（オセアニアは日付変更線をまたぐので180を超える）
const REGION_BOX = {
  'アジア': [25, -12, 150, 78], 'ヨーロッパ': [-25, 34, 60, 72], 'アフリカ': [-20, -36, 55, 38],
  '北・中央アメリカ': [-170, 5, -50, 84], '南アメリカ': [-85, -57, -33, 13], 'オセアニア': [110, -50, 190, 22],
};
const MODES = [
  { k: 'f2n', label: '国旗 → 国名', desc: '国旗を見て国名を選ぶ', q: 'flag', a: 'name' },
  { k: 'n2f', label: '国名 → 国旗', desc: '国名を見て国旗を選ぶ', q: 'name', a: 'flag' },
  { k: 'm2f', label: '場所 → 国旗', desc: '地図の場所から国旗を選ぶ', q: 'map', a: 'flag', nameOpt: true },
  { k: 'f2m', label: '国旗 → 場所', desc: '国旗を見て地図の場所を選ぶ', q: 'flag', a: 'map', nameOpt: true },
];
const KINDS = [
  { k: 'practice', label: '練習', desc: 'まちがえた問題は後半にもう一度出る。全部正解したら終了' },
  { k: 'challenge', label: '挑戦', desc: 'まちがえたら最初からやり直し。ノーミスでクリアを目指す' },
];
const COUNTS = [5, 10, 20, 'all'];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const S = Object.assign({ region: 'all', dopa: false, sound: true }, store.get('settings', {}));
const P = Object.assign({ mode: 'f2n', name: false, kind: 'practice', count: 10 }, store.get('setup', {}));
let misses = store.get('misses', {});
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const fmt = n => n.toLocaleString('ja-JP');
const $ = id => document.getElementById(id);
const regionLabel = r => r === 'all' ? '全世界' : r;
const poolFor = r => r === 'all' ? C : C.filter(c => c.r === r);
const modeOf = k => MODES.find(m => m.k === k);

/* ---------- 地図 ---------- */
const graticule = d3.geoGraticule10();
const W = 640, H = 360;
const bboxPoints = (x0, y0, x1, y1) => ({ type: 'MultiPoint', coordinates: [[x0, y0], [x1, y0], [x1, y1], [x0, y1], [(x0 + x1) / 2, y0], [(x0 + x1) / 2, y1], [x0, (y0 + y1) / 2], [x1, (y0 + y1) / 2]] });
const WORLD_BOX = [-169, -57, 191, 84]; // 南極は省く。ベーリング海峡で切ってロシアの東端もつなげる
function boxProjection([x0, y0, x1, y1], w, h) {
  const cx = (x0 + x1) / 2;
  return d3.geoNaturalEarth1().rotate([-cx, 0]).fitExtent([[6, 6], [w - 6, h - 6]], bboxPoints(x0, y0, x1, y1)).clipExtent([[0, 0], [w, h]]);
}
// 国の本体の範囲。遠く離れた海外領土（仏領ギアナ、カリブのオランダ領、イースター島など）は入れない
function mainBounds(f) {
  const polys = f.geometry.type === 'MultiPolygon' ? f.geometry.coordinates.map(co => ({ type: 'Polygon', coordinates: co })) : [f.geometry];
  const big = polys.reduce((a, b) => d3.geoArea(b) > d3.geoArea(a) ? b : a);
  const lon0 = d3.geoCentroid(big)[0];
  const boxes = polys.map(g => {
    let [[x0, y0], [x1, y1]] = d3.geoBounds(g);
    if (x1 < x0) x1 += 360;
    const k = Math.round((lon0 - (x0 + x1) / 2) / 360) * 360; // 日付変更線をまたぐ島を本体の側にそろえる
    return { g, b: [x0 + k, y0, x1 + k, y1] };
  });
  let box = boxes.find(o => o.g === big).b, rest = boxes.filter(o => o.g !== big), added = true;
  while (added) {
    added = false;
    rest = rest.filter(({ b }) => {
      const dx = Math.max(0, b[0] - box[2], box[0] - b[2]), dy = Math.max(0, b[1] - box[3], box[1] - b[3]);
      if (Math.hypot(dx, dy) > 10) return true;
      box = [Math.min(box[0], b[0]), Math.min(box[1], b[1]), Math.max(box[2], b[2]), Math.max(box[3], b[3])];
      return added = true, false;
    });
  }
  return [[box[0], box[1]], [box[2], box[3]]];
}
function projectionFor(c, region, w, h) {
  // 地域が選ばれていればその地域全体、全世界なら国の周辺を切り出す
  if (REGION_BOX[region]) return boxProjection(REGION_BOX[region], w, h);
  const f = featOf(c);
  let [[x0, y0], [x1, y1]] = f ? mainBounds(f) : [[c.ll[1], c.ll[0]], [c.ll[1], c.ll[0]]];
  const small = c.ar < 25000 || !f;
  if (x1 - x0 > 180) { x0 = c.ll[1] - 40; x1 = c.ll[1] + 40; } // 米国など飛び地が広い国
  if (small) { x0 = x1 = c.ll[1]; y0 = y1 = c.ll[0]; }
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const span = Math.max(x1 - x0, (y1 - y0) * 1.6, 28) * 1.5;
  const half = span / 2, vhalf = Math.min(80, half / 1.6);
  return d3.geoNaturalEarth1().rotate([-cx, 0]).fitExtent([[0, 0], [w, h]], bboxPoints(cx - half, Math.max(-85, cy - vhalf), cx + half, Math.min(85, cy + vhalf))).clipExtent([[0, 0], [w, h]]);
}
function drawMap(svg, c, { region = 'all', highlight = true, w = W, h = H } = {}) {
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  const proj = projectionFor(c, region, w, h), path = d3.geoPath(proj);
  const f = featOf(c);
  let out = `<path class="graticule" d="${path(graticule)}"></path>`;
  for (const g of feats) {
    const d = path(g);
    if (d) out += `<path d="${d}"${highlight && f && String(g.id) === String(f.id) ? ' class="on"' : ''}></path>`;
  }
  if (highlight) {
    // 小さい国、地域全体を映して小さく見える国には丸印をつける
    const onPath = f ? path(f) : null;
    const small = c.ar < 25000 || !f || (REGION_BOX[region] && c.ar < 120000);
    if (small || !onPath) { const q = proj([c.ll[1], c.ll[0]]); if (q) out += `<circle class="ring" cx="${q[0]}" cy="${q[1]}" r="12"></circle>`; }
  }
  svg.innerHTML = `<g class="layer">${out}</g>`;
}
function mapSvg(c, label, opts = {}) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.classList.add('map'); s.setAttribute('role', 'img'); s.setAttribute('aria-label', label);
  drawMap(s, c, opts);
  return s;
}
function zoomableMap(c, label, opts = {}) {
  // 出題用の大きい地図。ホイール／ピンチ／ドラッグと ＋－ ボタンで拡大縮小できる
  const box = document.createElement('div'); box.className = 'mapbox';
  const s = mapSvg(c, label, opts); s.classList.add('zoomable'); box.append(s);
  const g = s.querySelector('.layer');
  const zoom = d3.zoom().scaleExtent([1, 10]).translateExtent([[0, 0], [W, H]]).extent([[0, 0], [W, H]]).on('zoom', e => g.setAttribute('transform', e.transform));
  const sel = d3.select(s).call(zoom);
  const ctl = document.createElement('div'); ctl.className = 'zoomctl';
  ctl.innerHTML = '<button type="button" aria-label="縮小">−</button><button type="button" aria-label="拡大">＋</button><button type="button" class="reset">戻す</button>';
  const [minus, plus, reset] = ctl.children;
  minus.onclick = () => sel.transition().duration(200).call(zoom.scaleBy, 1 / 1.6);
  plus.onclick = () => sel.transition().duration(200).call(zoom.scaleBy, 1.6);
  reset.onclick = () => sel.transition().duration(200).call(zoom.transform, d3.zoomIdentity);
  box.append(ctl);
  return box;
}

/* ---------- ドパガキ向けの演出（紙吹雪・効果音・ポップ文字） ---------- */
const FX = {
  ac: null, parts: [], cv: null, raf: 0,
  audio() {
    if (!S.sound) return null;
    try { this.ac ||= new (window.AudioContext || window.webkitAudioContext)(); if (this.ac.state === 'suspended') this.ac.resume(); return this.ac; } catch { return null; }
  },
  tone(ac, f, t, dur, type = 'square', vol = .07, slide) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
  },
  sfx(kind, combo = 0) {
    const ac = this.audio(); if (!ac) return;
    const t = ac.currentTime;
    if (kind === 'correct') {
      // コンボが続くほど音が上がっていく
      const base = 523.25 * 2 ** (Math.min(combo, 12) / 12);
      [0, 4, 7, 12].forEach((s, i) => this.tone(ac, base * 2 ** (s / 12), t + i * .06, .18));
      this.tone(ac, base * 4, t + .24, .25, 'triangle', .05);
    } else if (kind === 'wrong') {
      this.tone(ac, 220, t, .35, 'sawtooth', .06, 70);
    } else if (kind === 'fanfare') {
      [[523, 0], [659, .12], [784, .24], [1047, .36], [784, .52], [1047, .64]].forEach(([f, d]) => this.tone(ac, f, t + d, d > .5 ? .5 : .14, 'square', .06));
    }
  },
  buzz(p) { try { navigator.vibrate?.(p); } catch {} },
  confetti(rect, n = 90, rain = false) {
    if (!this.cv) { this.cv = document.createElement('canvas'); this.cv.className = 'fx-canvas'; document.body.append(this.cv); }
    const dpr = devicePixelRatio || 1, cv = this.cv;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    const cols = ['#ff1f7a', '#ffc400', '#00e676', '#00b0ff', '#d500f9', '#ff7a00', '#ffffff'];
    const cx = rect ? rect.left + rect.width / 2 : innerWidth / 2, cy = rect ? rect.top + rect.height / 2 : innerHeight / 3;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 9;
      this.parts.push(rain
        ? { x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .6, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 3, r: Math.random() * 6, vr: (Math.random() - .5) * .3, s: 6 + Math.random() * 6, c: cols[i % cols.length], life: 260 }
        : { x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, s: 5 + Math.random() * 6, c: cols[i % cols.length], life: 120 });
    }
    if (!this.raf) this.raf = requestAnimationFrame(() => this.tick());
  },
  tick() {
    const ctx = this.cv.getContext('2d'), dpr = devicePixelRatio || 1;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, innerWidth, innerHeight);
    this.parts = this.parts.filter(p => p.life-- > 0 && p.y < innerHeight + 40);
    for (const p of this.parts) {
      p.vy += .28; p.vx *= .985; p.vy = Math.min(p.vy, 7); p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2 * Math.abs(Math.cos(p.r * 2)) + 1); ctx.restore();
    }
    this.raf = this.parts.length ? requestAnimationFrame(() => this.tick()) : 0;
  },
  pop(text, cls = '') {
    document.querySelectorAll('.fx-pop').forEach(el => el.remove());
    const el = document.createElement('div'); el.className = 'fx-pop ' + cls; el.textContent = text;
    el.onanimationend = () => el.remove(); document.body.append(el);
  },
  pts(n, rect) {
    const el = document.createElement('div'); el.className = 'fx-pts'; el.textContent = `+${fmt(n)}`;
    el.style.left = (rect.left + rect.width / 2) + 'px'; el.style.top = rect.top + 'px';
    el.onanimationend = () => el.remove(); document.body.append(el);
  },
  flash(color) {
    const el = document.createElement('div'); el.className = 'fx-flash';
    el.style.background = `radial-gradient(circle at 50% 45%, ${color}, transparent 70%)`;
    el.onanimationend = () => el.remove(); document.body.append(el);
  },
};
const PRAISE = ['正解！！', 'ナイス！', '天才！？', 'すごすぎ！', 'さすが！', '神！', 'つよい！', '完璧！'];
const comboText = n => n >= 20 ? `👑 ${n} COMBO 👑` : n >= 10 ? `⚡${n} COMBO⚡` : n >= 5 ? `🔥${n} COMBO🔥` : `${n} COMBO!`;

/* ---------- 画面切り替え ---------- */
const SCREENS = ['home', 'settings', 'setup', 'quiz', 'result', 'book'];
function show(name) {
  for (const s of SCREENS) $('scr-' + s).hidden = s !== name;
  document.body.dataset.screen = name;
  $('topbar').hidden = name === 'home';
  if (name === 'settings') renderSettings();
  if (name === 'setup') renderSetup();
  if (name === 'book') renderBook();
  window.scrollTo({ top: 0 });
}
$('brand').onclick = () => show('home');
$('home-play').onclick = () => show('setup');
$('home-settings').onclick = () => show('settings');
$('home-book').onclick = () => show('book');
$('to-book').onclick = () => show('book');
$('to-settings').onclick = () => show('settings');
$('home-flags').innerHTML = shuffle(C).slice(0, 30).map(c => `<img src="${flag(c.a)}" alt="">`).join('');

/* ---------- 設定 ---------- */
function renderSettings() {
  $('set-dopa').checked = S.dopa;
  $('set-sound').checked = S.sound;
  $('set-sound-row').hidden = !S.dopa;
  const n = Object.values(misses).filter(v => v > 0).length;
  $('set-record').textContent = n ? `まちがえた記録: ${n}か国` : 'まちがえた記録はまだない';
  $('set-reset').hidden = !n;
}
const applyDopa = () => document.body.classList.toggle('dopa', S.dopa);
$('set-dopa').onchange = e => {
  S.dopa = e.target.checked; store.set('settings', S); applyDopa(); renderSettings();
  if (S.dopa) { FX.sfx('correct', 3); FX.confetti(e.target.getBoundingClientRect(), 80); FX.pop('ドパミン全開！'); }
};
$('set-sound').onchange = e => { S.sound = e.target.checked; store.set('settings', S); if (S.sound) FX.sfx('correct', 0); };
$('set-reset').onclick = () => { misses = {}; store.set('misses', misses); renderSettings(); };
$('set-done').onclick = () => show('home');

/* ---------- モード選択 ---------- */
function renderSetup() {
  $('modes').innerHTML = MODES.map(m => `<button class="modecard" aria-pressed="${m.k === P.mode}" data-k="${m.k}"><b>${m.label}</b><span>${m.desc}</span></button>`).join('');
  $('nameopt-field').hidden = !modeOf(P.mode).nameOpt;
  $('nameopt').checked = P.name;
  $('kinds').innerHTML = KINDS.map(k => `<button class="modecard" aria-pressed="${k.k === P.kind}" data-k="${k.k}"><b>${k.label}</b><span>${k.desc}</span></button>`).join('');
  $('regions').innerHTML = [['all', '全世界'], ...REGIONS.map(r => [r, r])].map(([v, l]) => `<button class="chip" aria-pressed="${v === S.region}" data-r="${v}">${l}<span class="mono"> ${poolFor(v).length}</span></button>`).join('');
  const n = poolFor(S.region).length;
  if (P.count !== 'all' && P.count > n) P.count = 'all';
  $('counts').innerHTML = COUNTS.map(c => `<button class="chip" aria-pressed="${c === P.count}" data-c="${c}"${c !== 'all' && c > n ? ' disabled' : ''}>${c === 'all' ? `全部（${n}）` : c + '問'}</button>`).join('');
}
$('modes').onclick = e => { const b = e.target.closest('.modecard'); if (!b) return; P.mode = b.dataset.k; store.set('setup', P); renderSetup(); };
$('kinds').onclick = e => { const b = e.target.closest('.modecard'); if (!b) return; P.kind = b.dataset.k; store.set('setup', P); renderSetup(); };
$('regions').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; S.region = b.dataset.r; store.set('settings', S); renderSetup(); };
$('counts').onclick = e => { const b = e.target.closest('.chip'); if (!b || b.disabled) return; P.count = b.dataset.c === 'all' ? 'all' : +b.dataset.c; store.set('setup', P); renderSetup(); };
$('nameopt').onchange = e => { P.name = e.target.checked; store.set('setup', P); };
$('start').onclick = () => startGame();
$('quit').onclick = () => show('setup');

/* ---------- クイズ ---------- */
let G;
function startGame() {
  const pool = poolFor(S.region);
  const n = P.count === 'all' ? pool.length : Math.min(P.count, pool.length);
  const set = shuffle(pool).slice(0, n);
  G = { mode: modeOf(P.mode), kind: P.kind, set, queue: set.slice(), done: 0, firstTry: 0, wrongs: 0, attempts: 1, streak: 0, best: 0, pts: 0, seen: new Set(), missed: new Set(), cur: null, answered: false };
  show('quiz');
  nextQuestion();
}
function makeQuestion(c) {
  const near = shuffle(C.filter(x => x !== c && x.r === c.r));
  const far = shuffle(C.filter(x => x !== c && x.r !== c.r));
  const opts = [c];
  for (const x of [...near, ...far]) { if (opts.length >= 4) break; opts.push(x); }
  return { c, opts: shuffle(opts) };
}
function nextQuestion() {
  if (!G.queue.length) return showResult();
  const c = G.queue.shift();
  G.cur = makeQuestion(c); G.answered = false;
  const m = G.mode, box = $('qcard');
  box.innerHTML = ''; box.className = `qcard q-${m.q} a-${m.a}`;
  const main = document.createElement('div'); main.className = 'qmain'; box.append(main);
  const showName = m.nameOpt && P.name;
  // 国名ONのときは選択肢に国名を出す（問題文にも出すと名前合わせで解けてしまうので出さない）
  const labels = { f2n: 'この国旗はどこの国？', n2f: 'この国の国旗は？', m2f: '色がついている場所の国旗は？', f2m: 'この国旗の国はどこ？' };
  main.insertAdjacentHTML('beforeend', `<p class="qlabel">${esc(labels[m.k])}</p>`);
  if (m.q === 'flag') main.insertAdjacentHTML('beforeend', `<img class="qflag" src="${flag(c.a)}" alt="国旗">`);
  if (m.q === 'name') main.insertAdjacentHTML('beforeend', `<p class="qbig">${esc(c.n)}</p><p class="qsub">${esc(c.r)}</p>`);
  if (m.q === 'map') main.append(zoomableMap(c, '出題中の国の位置', { region: S.region }));
  const ch = document.createElement('div');
  ch.className = 'choices' + (m.a === 'name' ? ' textc' : '');
  G.cur.opts.forEach((o, k) => {
    const b = document.createElement('button'); b.className = 'choice'; b.dataset.a = o.a;
    if (m.a === 'name') b.innerHTML = `<kbd>${k + 1}</kbd><span>${esc(o.n)}</span>`;
    if (m.a === 'flag') { b.classList.add('flagc'); b.innerHTML = `<kbd>${k + 1}</kbd><img src="${flag(o.a)}" alt="選択肢${k + 1}の国旗">`; }
    if (m.a === 'map') { b.classList.add('mapc'); b.innerHTML = `<kbd>${k + 1}</kbd>`; b.append(mapSvg(o, `選択肢${k + 1}の地図`, { region: S.region, w: 640, h: 480 })); }
    if (showName) b.insertAdjacentHTML('beforeend', `<span class="cname">${esc(o.n)}</span>`);
    ch.append(b);
  });
  ch.onclick = e => { const b = e.target.closest('.choice'); if (b && !b.disabled) answer(b.dataset.a); };
  box.append(ch);
  box.insertAdjacentHTML('beforeend', '<div class="rslot" aria-hidden="true"><p class="rslot-hint">答えたら、ここに国のプロフィールが出るよ</p><p class="rslot-keys"><kbd>1</kbd>〜<kbd>4</kbd> キーでも答えられる ・ <kbd>Enter</kbd> で次へ</p></div>');
  updateProgress();
}
function updateProgress(answered) {
  const n = G.set.length, remaining = G.queue.length + (answered ? 0 : 1);
  $('pbar').style.width = (G.done / n * 100) + '%';
  if (G.kind === 'practice') {
    $('pnum').textContent = `覚えた ${G.done} / ${n}`;
    $('pscore').textContent = `残り ${remaining}問`;
  } else {
    $('pnum').textContent = `${Math.min(G.done + 1, n)} / ${n}`;
    $('pscore').textContent = G.attempts > 1 ? `${G.attempts}回目の挑戦` : '';
  }
  $('pstreak').textContent = G.streak >= 2 ? (S.dopa ? comboText(G.streak) : `${G.streak}連続！`) : '';
  $('pstreak').classList.toggle('hot', G.streak >= 5);
  $('ppts').textContent = `${fmt(G.pts)} pt`;
}
function answer(a) {
  if (G.answered) return;
  G.answered = true;
  const c = G.cur.c, right = a === c.a, first = !G.seen.has(c.a);
  G.seen.add(c.a);
  document.querySelectorAll('.choice').forEach(b => {
    b.disabled = true;
    if (b.dataset.a === c.a) b.classList.add('ok'); else if (b.dataset.a === a) b.classList.add('ng');
  });
  if (right) {
    G.done++; G.streak++; G.best = Math.max(G.best, G.streak);
    if (first) G.firstTry++;
    misses[c.a] = Math.max(0, (misses[c.a] || 0) - 1);
  } else {
    G.wrongs++; G.streakLost = G.streak; G.streak = 0; G.missed.add(c.a);
    misses[c.a] = (misses[c.a] || 0) + 1;
    if (G.kind === 'practice') G.queue.push(c); // 後半にまわす
  }
  store.set('misses', misses);
  if (S.dopa) dopaAnswer(right);
  const r = document.createElement('div');
  r.className = 'reveal';
  let verdict = right ? (S.dopa ? PRAISE[Math.random() * PRAISE.length | 0] : '正解！') : `ざんねん。正解は「${esc(c.n)}」`;
  if (!right && G.kind === 'challenge') verdict += '。最初からやり直し！';
  if (!right && G.kind === 'practice') verdict += '。あとでもう一度出るよ';
  r.innerHTML = `<p class="verdict ${right ? 'ok' : 'ng'}">${verdict}</p>${factsHTML(c)}`;
  if (G.mode.q !== 'map' && G.mode.a !== 'map') r.append(mapSvg(c, `${c.n}の位置`, { region: S.region }));
  const nx = document.createElement('button');
  nx.className = 'btn next'; nx.id = 'next';
  if (!right && G.kind === 'challenge') { nx.textContent = '最初から →'; nx.onclick = restartChallenge; }
  else { nx.textContent = G.queue.length ? '次の問題 →' : '結果を見る'; nx.onclick = nextQuestion; }
  r.append(nx);
  const slot = $('qcard').querySelector('.rslot');
  if (slot) slot.replaceWith(r); else $('qcard').append(r);
  updateProgress(true);
  nx.focus({ preventScroll: true });
  r.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}
function dopaAnswer(right) {
  const ok = document.querySelector('.choice.ok'), rect = ok ? ok.getBoundingClientRect() : null;
  if (right) {
    // 3連続ごとに倍率アップ
    const mult = 1 + Math.floor(G.streak / 3), gain = 100 * mult;
    G.pts += gain;
    FX.sfx('correct', G.streak - 1); FX.buzz(25);
    FX.confetti(rect, G.streak >= 5 ? 160 : 90);
    FX.flash(G.streak >= 5 ? 'rgb(255 196 0 / .55)' : 'rgb(255 255 255 / .6)');
    if (rect) FX.pts(gain, rect);
    if (G.streak >= 2) FX.pop(comboText(G.streak) + (mult > 1 ? ` ×${mult}` : ''), G.streak < 5 ? 'small' : '');
  } else {
    FX.sfx('wrong'); FX.buzz([60, 40, 60]);
    FX.flash('rgb(255 59 48 / .35)');
    $('qcard').classList.remove('shake'); void $('qcard').offsetWidth; $('qcard').classList.add('shake');
    if (G.streakLost >= 3) FX.pop(`${G.streakLost} COMBO 終了…`, 'small bad');
  }
}
function restartChallenge() {
  G.attempts++; G.done = 0; G.streak = 0; G.queue = shuffle(G.set);
  nextQuestion();
}
function factsHTML(c) {
  return `<div class="facts"><img src="${flag(c.a)}" alt="${esc(c.n)}の国旗"><dl>
    <dd class="name">${esc(c.n)}</dd>
    <dt>首都</dt><dd>${esc(c.c)}</dd>
    <dt>地域</dt><dd>${esc(c.r)}</dd>
    <dt>面積</dt><dd class="mono">${fmt(c.ar)} km²</dd>
    <dt>ISO</dt><dd class="mono">${c.a.toUpperCase()}</dd></dl></div>`;
}
function showResult() {
  const n = G.set.length, missed = [...G.missed].map(a => byA.get(a));
  let head, big, stats;
  if (G.kind === 'practice') {
    head = G.wrongs === 0 ? 'パーフェクト！' : G.firstTry >= n * .7 ? 'いい感じ！' : '次はもっといけるはず';
    big = `${G.firstTry}<small> / ${n} 一発正解</small>`;
    stats = `<span>やり直し <b>${G.wrongs}</b>回</span><span>最高連続 <b>${G.best}</b></span>`;
  } else {
    head = G.attempts === 1 ? 'ノーミスでクリア！' : 'クリア！';
    big = `${n}<small>問連続正解</small>`;
    stats = `<span>挑戦 <b>${G.attempts}</b>回目でクリア</span><span>まちがえ <b>${G.wrongs}</b>回</span>`;
  }
  const ratio = G.firstTry / n;
  const rank = G.kind === 'challenge' ? (G.attempts === 1 ? 'S' : G.attempts <= 3 ? 'A' : 'B') : ratio === 1 ? 'S' : ratio >= .8 ? 'A' : ratio >= .6 ? 'B' : 'C';
  const dopaHead = S.dopa ? `<p class="rank">RANK ${rank}</p><p class="pts">${fmt(G.pts)} pt</p>` : '';
  $('rcard').innerHTML = `<div class="result">${dopaHead}<p class="qlabel">${head}</p><p class="score">${big}</p><div class="stats">${stats}</div>
    <p class="hint">${G.mode.label}／${KINDS.find(k => k.k === G.kind).label}／${regionLabel(S.region)}</p></div>
    <div class="rside" id="r-side">${missed.length ? `<p class="qlabel" style="font-size:1rem">まちがえた国</p><ul class="misslist">${missed.map(c => `<li><img src="${flag(c.a)}" alt=""><b>${esc(c.n)}</b><span>${esc(c.c)}</span></li>`).join('')}</ul>` : ''}</div>
    <div class="row center"><button class="btn ghost" id="r-setup">モード選択へ</button><button class="btn" id="r-again">もう一回</button></div>`;
  $('r-again').onclick = startGame;
  $('r-setup').onclick = () => show('setup');
  show('result');
  $('r-again').focus({ preventScroll: true });
  if (S.dopa) { FX.sfx('fanfare'); FX.confetti(null, 220, true); FX.pop(G.wrongs === 0 ? 'PERFECT!!' : 'CLEAR!!'); }
}
document.addEventListener('keydown', e => {
  if ($('scr-quiz').hidden || e.target.matches('input, select, textarea') || $('detail').open) return;
  if (/^[1-4]$/.test(e.key)) { const b = document.querySelectorAll('.choice')[+e.key - 1]; if (b && !b.disabled) b.click(); }
  if (e.key === 'Enter' && $('next') && !(document.activeElement instanceof HTMLButtonElement)) $('next').click();
});

/* ---------- 図鑑 ---------- */
let bregion = 'all', bview = store.get('bview', 'list'), bsel = null, bmapKey = '';
$('bregion').innerHTML = [['all', 'すべての地域'], ...REGIONS.map(r => [r, r])].map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
function renderBook() {
  const q = $('q').value.trim();
  const list = C.filter(c => (bregion === 'all' || c.r === bregion) && (!q || c.n.includes(q) || c.c.includes(q)))
    .sort((a, b) => a.n.localeCompare(b.n, 'ja'));
  $('bcount').textContent = `${list.length}か国`;
  for (const b of $('bview').children) b.setAttribute('aria-pressed', b.dataset.v === bview);
  $('grid').hidden = bview !== 'list';
  $('bmap').hidden = bview !== 'map';
  $('hidecap-row').hidden = bview !== 'list';
  if (bview === 'map') return renderBookMap(q ? list : []);
  $('grid').className = 'grid' + ($('hidecap').checked ? ' hide-cap' : '');
  $('grid').innerHTML = list.map(c => `<button class="card" data-a="${c.a}"><img loading="lazy" src="${flag(c.a)}" alt=""><b>${esc(c.n)}</b><span>首都 ${esc(c.c)}</span></button>`).join('');
}
$('q').oninput = renderBook;
$('bregion').onchange = e => { bregion = e.target.value; renderBook(); };
$('bview').onclick = e => { const b = e.target.closest('button'); if (!b) return; bview = b.dataset.v; store.set('bview', bview); renderBook(); };

/* 図鑑の地図。国の形をタップ、小さい国は丸印をタップすると情報が出る */
const cOfFeat = g => C.find(c => c.a === 'xk' ? String(g.id) === 'XK' : c.id === String(g.id));
const featCountry = new Map(feats.map(g => [g, cOfFeat(g)]));
const isSmall = c => c.ar < 25000 || !featOf(c);
function renderBookMap(matches) {
  const box = $('bmapbox'), w = W, h = H;
  if (bmapKey !== bregion) {
    // 地域が変わったときだけ描き直す（ズームや選択はそのまま残す）
    bmapKey = bregion;
    const proj = boxProjection(REGION_BOX[bregion] || WORLD_BOX, w, h), path = d3.geoPath(proj);
    let out = `<path class="graticule" d="${path(graticule)}"></path>`;
    for (const g of feats) {
      const d = path(g); if (!d) continue;
      const c = featCountry.get(g);
      const cls = c ? 'pick' + (bregion !== 'all' && c.r !== bregion ? ' dim' : '') : '';
      out += `<path d="${d}"${cls ? ` class="${cls}"` : ''}${c ? ` data-a="${c.a}"` : ''}></path>`;
    }
    // 丸印は見た目用（.dot）とタップ用の大きめの透明円（.hit）を重ねる
    let dots = '', hits = '';
    for (const c of poolFor(bregion).filter(isSmall)) {
      const q = proj([c.ll[1], c.ll[0]]); if (!q) continue;
      dots += `<circle class="dot" data-a="${c.a}" cx="${q[0]}" cy="${q[1]}" r="4"></circle>`;
      hits += `<circle class="hit" data-a="${c.a}" cx="${q[0]}" cy="${q[1]}" r="8"><title>${esc(c.n)}</title></circle>`;
    }
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.classList.add('map', 'zoomable'); s.setAttribute('viewBox', `0 0 ${w} ${h}`);
    s.setAttribute('role', 'img'); s.setAttribute('aria-label', `${regionLabel(bregion)}の地図。国をタップすると情報が出る`);
    s.innerHTML = `<g class="layer">${out}${dots}${hits}</g>`;
    box.innerHTML = ''; box.append(s);
    const g = s.querySelector('.layer');
    // 丸印は拡大しても画面上の大きさが変わらないようにする
    const sizeDots = k => {
      const u = w / (s.clientWidth || w) / k;
      s.querySelectorAll('.dot').forEach(el => el.setAttribute('r', 5 * u));
      s.querySelectorAll('.hit').forEach(el => el.setAttribute('r', 13 * u));
    };
    const zoom = d3.zoom().scaleExtent([1, 24]).translateExtent([[0, 0], [w, h]]).extent([[0, 0], [w, h]]).clickDistance(6)
      .on('zoom', e => { g.setAttribute('transform', e.transform); sizeDots(e.transform.k); });
    const sel = d3.select(s).call(zoom);
    requestAnimationFrame(() => sizeDots(1));
    const ctl = document.createElement('div'); ctl.className = 'zoomctl';
    ctl.innerHTML = '<button type="button" aria-label="縮小">−</button><button type="button" aria-label="拡大">＋</button><button type="button" class="reset">戻す</button>';
    const [minus, plus, reset] = ctl.children;
    minus.onclick = () => sel.transition().duration(200).call(zoom.scaleBy, 1 / 1.6);
    plus.onclick = () => sel.transition().duration(200).call(zoom.scaleBy, 1.6);
    reset.onclick = () => sel.transition().duration(200).call(zoom.transform, d3.zoomIdentity);
    box.append(ctl);
    s.addEventListener('click', e => { const t = e.target.closest('[data-a]'); if (t) selectBook(t.dataset.a, true); });
  }
  const m = new Set(matches.map(c => c.a));
  box.querySelectorAll('[data-a]').forEach(el => el.classList.toggle('match', m.has(el.dataset.a)));
  if (matches.length === 1) bsel = matches[0].a;
  selectBook(bsel, false);
}
function selectBook(a, tapped) {
  bsel = a;
  $('bmapbox').querySelectorAll('[data-a]').forEach(el => el.classList.toggle('on', el.dataset.a === a));
  const c = a && byA.get(a);
  $('binfo').innerHTML = c ? factsHTML(c) : `<p class="hint">地図の国をタップすると、国旗・首都などが出るよ。<br>小さい国は丸印をタップ。ピンチやホイールで拡大できる。</p>`;
  if (c && tapped && innerWidth < 900) $('binfo').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
$('hidecap').onchange = renderBook;
$('grid').onclick = e => {
  const b = e.target.closest('.card'); if (!b) return;
  const c = byA.get(b.dataset.a), inner = $('detail-inner');
  inner.innerHTML = `<button class="close" id="dclose">閉じる</button>${factsHTML(c)}`;
  inner.append(mapSvg(c, `${c.n}の位置`));
  $('dclose').onclick = () => $('detail').close();
  $('detail').showModal();
};
$('detail').onclick = e => { if (e.target === $('detail')) $('detail').close(); };

/* ---------- 起動 ---------- */
applyDopa();
const start = { '#play': 'setup', '#settings': 'settings', '#book': 'book' }[location.hash] || 'home';
show(start);
</script>
</body>
