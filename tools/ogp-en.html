<!doctype html>
<!-- 英語のシェア用画像 icons/ogp-en.png（1200x630）の元。見た目は tools/ogp.html と同じ。作り直し: node tools/make_ogp.mjs en -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
html,body{margin:0}
body{width:1200px;height:630px;background:#1b2a33;color:#f4f6ef;font-family:"Zen Maru Gothic",sans-serif;display:flex;align-items:center;gap:64px;padding:0 80px;box-sizing:border-box;overflow:hidden;position:relative}
body::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 85% 120%,transparent 0 38px,rgba(244,246,239,.05) 38px 40px)}
img{width:300px;height:300px;flex:none;position:relative}
.t{position:relative}
h1{font-size:104px;font-weight:900;margin:0;white-space:nowrap;letter-spacing:.02em;line-height:1}
p{font-size:40px;font-weight:700;margin:36px 0 0;line-height:1.45;color:#d5e6ec}
.n{color:#e39b2d}
</style></head><body>
<img src="../icons/icon.svg" alt="">
<div class="t"><h1>Flag Master</h1>
<p>Learn the flags, names, and locations<br>of <span class="n">195</span> countries with a 4-choice quiz</p></div>
</body></html>
