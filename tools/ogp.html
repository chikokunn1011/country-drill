<!doctype html>
<!-- シェア用画像 icons/ogp.png（1200x630）の元。作り直し: node tools/make_ogp.mjs -->
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
html,body{margin:0}
body{width:1200px;height:630px;background:#1b2a33;color:#f4f6ef;font-family:"Zen Maru Gothic",sans-serif;display:flex;align-items:center;gap:64px;padding:0 80px;box-sizing:border-box;overflow:hidden;position:relative}

p{font-size:40px;font-weight:700;margin:36px 0 0;line-height:1.45;color:#d5e6ec}
.n{color:#e39b2d}
</style></head><body>
<img src="../icons/icon.svg" alt="">
<div class="t"><h1>国旗マスター</h1>
<p><span class="n">195</span>か国の国旗・国名・場所を<br>4択クイズで覚えよう</p></div>
