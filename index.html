<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="国旗・首都・地図の位置を4択クイズと図鑑で覚える、195か国の学習サイト。">
<title>195か国ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 地図帳の1ページ。上にタブ、中央に問題カード、下に答えの解説（地図＋データ） */
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --ink: #1b2a33;
  --muted: #5b6b73;
  --line: #d3dcdc;
  --accent: #1f5f8b;
  --accent-ink: #ffffff;
  --hl: #e39b2d;
  --ok: #2e8b57;
  --ok-soft: #e1f2e8;
  --ng: #c43d3d;
  --ng-soft: #f8e3e3;
  --ocean: #d5e6ec;
  --land: #f4f6ef;
  --border-land: #b9c6c4;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171c; --surface: #18232a; --ink: #e5edf0; --muted: #93a4ac; --line: #2c3a42;
    --accent: #6fb3e0; --accent-ink: #0c1820; --hl: #f0b04a; --ok: #5cc48a; --ok-soft: #173326;
    --ng: #ec7a7a; --ng-soft: #3a1d1f; --ocean: #142b38; --land: #2a3a40; --border-land: #45575e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171c; --surface: #18232a; --ink: #e5edf0; --muted: #93a4ac; --line: #2c3a42;
  --accent: #6fb3e0; --accent-ink: #0c1820; --hl: #f0b04a; --ok: #5cc48a; --ok-soft: #173326;
  --ng: #ec7a7a; --ng-soft: #3a1d1f; --ocean: #142b38; --land: #2a3a40; --border-land: #45575e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
header { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: 1.9rem; margin: 0; letter-spacing: .02em; text-wrap: balance; }
h1 small { display: block; font-family: var(--font-mono); font-weight: 400; font-size: .72rem; color: var(--muted); letter-spacing: .12em; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: 700 .92rem var(--font-display); padding: 6px 16px; border-radius: 999px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
button { font-family: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }

.settings { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 12px; font-size: .85rem; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
select, input[type="search"] { font: inherit; font-size: .88rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }

.progress { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: .8rem; color: var(--muted); gap: 12px; }
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.streak { color: var(--hl); font-weight: 500; }

.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 18px; align-items: center; }
.qlabel { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; text-align: center; margin: 0; }
.qflag { width: min(280px, 70%); aspect-ratio: 4/3; max-width: 100%; border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 2px 10px rgb(0 0 0 / .08); object-fit: cover; }
.qbig { font-family: var(--font-display); font-weight: 900; font-size: clamp(1.8rem, 6vw, 2.6rem); text-align: center; line-height: 1.25; margin: 0; }
.qsub { color: var(--muted); font-size: .85rem; margin: -10px 0 0; }
.map { width: 100%; aspect-ratio: 16/9; max-width: 100%; background: var(--ocean); border-radius: 10px; display: block; }
.map path { fill: var(--land); stroke: var(--border-land); stroke-width: .5; }
.map path.on { fill: var(--hl); stroke: var(--ink); stroke-width: .8; }
.map circle.ring { fill: none; stroke: var(--hl); stroke-width: 3; }
.map .graticule { fill: none; stroke: var(--border-land); stroke-width: .3; stroke-dasharray: 2 3; }

.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.choice { display: flex; align-items: center; gap: 10px; text-align: left; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 12px 14px; font-size: 1rem; font-weight: 500; cursor: pointer; min-height: 56px; min-width: 0; transition: border-color .15s, transform .1s; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice:active:not(:disabled) { transform: scale(.98); }
.choice kbd { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; flex: none; }
.choice span { min-width: 0; overflow-wrap: anywhere; }
.choice.ok { border-color: var(--ok); background: var(--ok-soft); }
.choice.ng { border-color: var(--ng); background: var(--ng-soft); }
.choice:disabled { cursor: default; }

.reveal { width: 100%; border-top: 1px dashed var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.verdict { font-family: var(--font-display); font-weight: 900; font-size: 1.2rem; margin: 0; }
.verdict.ok { color: var(--ok); } .verdict.ng { color: var(--ng); }
.facts { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
.facts img { width: 96px; aspect-ratio: 4/3; border: 1px solid var(--line); border-radius: 4px; object-fit: cover; }
.facts dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; min-width: 0; }
.facts dt { color: var(--muted); font-size: .78rem; letter-spacing: .06em; align-self: center; }
.facts dd { margin: 0; font-weight: 500; min-width: 0; }
.facts .name { font-family: var(--font-display); font-weight: 900; font-size: 1.3rem; grid-column: 1 / -1; }
.mono { font-family: var(--font-mono); font-size: .85rem; font-variant-numeric: tabular-nums; }
.next { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 10px 22px; font: 700 1rem var(--font-display); cursor: pointer; }

.result { text-align: center; }
.score { font-family: var(--font-display); font-weight: 900; font-size: 3.4rem; line-height: 1; margin: 0; }
.score small { font-size: 1.2rem; color: var(--muted); }
.misslist { list-style: none; margin: 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 6px; }
.misslist li { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; }
.misslist img { width: 48px; aspect-ratio: 4/3; border-radius: 3px; border: 1px solid var(--line); object-fit: cover; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); border-radius: 10px; padding: 9px 18px; font: 700 .95rem var(--font-display); cursor: pointer; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; text-align: left; color: var(--ink); min-width: 0; }
.card:hover { border-color: var(--accent); }
.card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); }
.card b { font-family: var(--font-display); font-size: .95rem; line-height: 1.3; }
.card span { font-size: .78rem; color: var(--muted); line-height: 1.3; }
.card.hide-cap span { visibility: hidden; }
.count { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
.toggle { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); }

dialog { border: 0; border-radius: 16px; padding: 0; background: var(--surface); color: var(--ink); width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgb(0 0 0 / .45); }
dialog .inner { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
dialog .close { align-self: flex-end; background: transparent; border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 4px 12px; cursor: pointer; }
footer { font-size: .75rem; color: var(--muted); text-align: center; }
footer a { color: inherit; }

@media (max-width: 480px) {
  .choices { grid-template-columns: 1fr; }
  .qcard { padding: 16px; }
  .facts { grid-template-columns: 72px 1fr; } .facts img { width: 72px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1><small>FLAGS · CAPITALS · MAP</small>195か国ドリル</h1>
    <div class="tabs" role="tablist">
      <button id="tab-quiz" role="tab" aria-selected="true">クイズ</button>
      <button id="tab-book" role="tab" aria-selected="false">図鑑</button>
    </div>
  </header>

  <section id="view-quiz" class="wrap" style="gap:14px">
    <div class="settings">
      <div class="chips" id="modes" aria-label="出題タイプ"></div>
      <select id="region" aria-label="地域"></select>
    </div>
    <div class="progress"><span id="pnum">1 / 10</span><div class="bar"><i id="pbar" style="width:0"></i></div><span id="pscore">正解 0</span><span class="streak" id="pstreak"></span></div>
    <div class="qcard" id="qcard"></div>
  </section>

  <section id="view-book" class="wrap" style="gap:14px" hidden>
    <div class="settings">
      <input type="search" id="q" placeholder="国名・首都で検索" aria-label="検索">
      <select id="bregion" aria-label="地域"></select>
      <label class="toggle"><input type="checkbox" id="hidecap"> 首都をかくす</label>
      <span class="count" id="bcount"></span>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <footer>国連加盟193か国＋バチカン・コソボ（日本が承認している国）。国旗: flag-icons（MIT）／地図: Natural Earth・world-atlas</footer>
</div>

<dialog id="detail"><div class="inner" id="detail-inner"></div></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="countries.js"></script>
<script src="flags.js"></script>
<script src="world.js"></script>
<script>
const C = window.COUNTRIES;
const byA = new Map(C.map(c => [c.a, c]));
const feats = topojson.feature(WORLD, WORLD.objects.countries).features;
const featById = new Map(feats.map(f => [String(f.id), f]));
const featOf = c => featById.get(c.a === 'xk' ? 'XK' : c.id);
const flagCache = {};
const flag = a => flagCache[a] ||= 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(FLAGS[a]);
const REGIONS = ['アジア', 'ヨーロッパ', 'アフリカ', '北・中央アメリカ', '南アメリカ', 'オセアニア'];
const MODES = [
  { k: 'flag', label: '国旗 → 国名' },
  { k: 'cap', label: '国名 → 首都' },
  { k: 'map', label: '地図 → 国名' },
  { k: 'rcap', label: '首都 → 国名' },
  { k: 'mix', label: 'ミックス' },
];
const ROUND = 10;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let misses = store.get('misses', {});
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const fmt = n => n.toLocaleString('ja-JP');

/* ---------- 地図 ---------- */
const graticule = d3.geoGraticule10();
function drawMap(svg, c) {
  const W = 640, H = 360;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const f = featOf(c);
  let [[x0, y0], [x1, y1]] = f ? d3.geoBounds(f) : [[c.ll[1], c.ll[0]], [c.ll[1], c.ll[0]]];
  if (x1 < x0) x1 += 360;
  const small = c.ar < 25000 || !f;
  if (x1 - x0 > 180) { x0 = c.ll[1] - 40; x1 = c.ll[1] + 40; } // 米国など飛び地が広い国
  if (small) { x0 = x1 = c.ll[1]; y0 = y1 = c.ll[0]; } // 島国・小国は代表地点を中心に
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const span = Math.max(x1 - x0, (y1 - y0) * 1.6, 28) * 1.5;
  const half = span / 2, vhalf = Math.min(80, half / 1.6);
  const box = { type: 'MultiPoint', coordinates: [[cx - half, cy], [cx + half, cy], [cx, Math.max(-85, cy - vhalf)], [cx, Math.min(85, cy + vhalf)]] };
  const proj = d3.geoNaturalEarth1().rotate([-cx, 0]).fitExtent([[0, 0], [W, H]], box).clipExtent([[0, 0], [W, H]]);
  const path = d3.geoPath(proj);
  let out = `<path class="graticule" d="${path(graticule)}"></path>`;
  for (const g of feats) {
    const d = path(g);
    if (d) out += `<path d="${d}"${g === f ? ' class="on"' : ''}></path>`;
  }
  if (small) {
    const q = proj([c.ll[1], c.ll[0]]);
    if (q) out += `<circle class="ring" cx="${q[0]}" cy="${q[1]}" r="14"></circle>`;
  }
  svg.innerHTML = out;
}
const mapSvg = (c, label) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.classList.add('map'); s.setAttribute('role', 'img'); s.setAttribute('aria-label', label); drawMap(s, c); return s; };

/* ---------- クイズ ---------- */
let mode = store.get('mode', 'flag');
let region = store.get('region', 'all');
let quiz;
const $ = id => document.getElementById(id);

function pool() {
  if (region === 'weak') return C.filter(c => misses[c.a] > 0);
  return region === 'all' ? C : C.filter(c => c.r === region);
}
function renderSettings() {
  $('modes').innerHTML = MODES.map(m => `<button class="chip" aria-pressed="${m.k === mode}" data-k="${m.k}">${m.label}</button>`).join('');
  const weakN = Object.values(misses).filter(v => v > 0).length;
  const opts = [['all', '全世界（195か国）'], ...REGIONS.map(r => [r, `${r}（${C.filter(c => c.r === r).length}）`])];
  if (weakN >= 4) opts.push(['weak', `苦手な国（${weakN}）`]);
  if (region === 'weak' && weakN < 4) region = 'all';
  $('region').innerHTML = opts.map(([v, l]) => `<option value="${v}"${v === region ? ' selected' : ''}>${l}</option>`).join('');
}
$('modes').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; mode = b.dataset.k; store.set('mode', mode); renderSettings(); startRound(); };
$('region').onchange = e => { region = e.target.value; store.set('region', region); startRound(); };

function startRound(list) {
  const p = list || pool();
  const qs = shuffle(p).slice(0, Math.min(ROUND, p.length));
  quiz = { qs, i: 0, score: 0, streak: 0, best: 0, missed: [] };
  showQuestion();
}
function makeQuestion(c) {
  const m = mode === 'mix' ? ['flag', 'cap', 'map', 'rcap'][Math.random() * 4 | 0] : mode;
  const field = m === 'cap' ? 'c' : 'n';
  const near = shuffle(C.filter(x => x !== c && x.r === c.r));
  const far = shuffle(C.filter(x => x !== c && x.r !== c.r));
  const opts = [c[field]];
  for (const x of [...near, ...far]) { if (opts.length >= 4) break; if (!opts.includes(x[field])) opts.push(x[field]); }
  return { c, m, field, opts: shuffle(opts), answer: c[field] };
}
function showQuestion() {
  const { qs, i } = quiz;
  const q = quiz.cur = makeQuestion(qs[i]);
  const c = q.c, box = $('qcard');
  box.innerHTML = '';
  const prompts = {
    flag: () => `<p class="qlabel">この国旗はどこの国？</p><img class="qflag" src="${flag(c.a)}" alt="国旗">`,
    cap: () => `<p class="qlabel">この国の首都は？</p><p class="qbig">${esc(c.n)}</p><p class="qsub">${esc(c.r)}</p>`,
    map: () => `<p class="qlabel">色がついている国はどこ？</p>`,
    rcap: () => `<p class="qlabel">ここが首都の国は？</p><p class="qbig">${esc(c.c)}</p><p class="qsub">${esc(c.r)}</p>`,
  };
  box.insertAdjacentHTML('beforeend', prompts[q.m]());
  if (q.m === 'map') box.append(mapSvg(c, '出題中の国の位置'));
  const ch = document.createElement('div');
  ch.className = 'choices';
  ch.innerHTML = q.opts.map((o, k) => `<button class="choice" data-v="${esc(o)}"><kbd>${k + 1}</kbd><span>${esc(o)}</span></button>`).join('');
  ch.onclick = e => { const b = e.target.closest('.choice'); if (b && !b.disabled) answer(b.dataset.v); };
  box.append(ch);
  updateProgress();
}
function updateProgress() {
  const { qs, i, score, streak } = quiz;
  $('pnum').textContent = `${Math.min(i + 1, qs.length)} / ${qs.length}`;
  $('pbar').style.width = (i / qs.length * 100) + '%';
  $('pscore').textContent = `正解 ${score}`;
  $('pstreak').textContent = streak >= 2 ? `${streak}連続！` : '';
}
function answer(v) {
  const q = quiz.cur, c = q.c, right = v === q.answer;
  if (quiz.answered === quiz.i) return;
  quiz.answered = quiz.i;
  document.querySelectorAll('.choice').forEach(b => {
    b.disabled = true;
    if (b.dataset.v === q.answer) b.classList.add('ok');
    else if (b.dataset.v === v) b.classList.add('ng');
  });
  if (right) { quiz.score++; quiz.streak++; quiz.best = Math.max(quiz.best, quiz.streak); misses[c.a] = Math.max(0, (misses[c.a] || 0) - 1); }
  else { quiz.streak = 0; quiz.missed.push(c); misses[c.a] = (misses[c.a] || 0) + 1; }
  store.set('misses', misses);
  const r = document.createElement('div');
  r.className = 'reveal';
  r.innerHTML = `<p class="verdict ${right ? 'ok' : 'ng'}">${right ? '正解！' : `ざんねん。正解は「${esc(q.answer)}」`}</p>${factsHTML(c)}`;
  if (q.m !== 'map') r.append(mapSvg(c, `${c.n}の位置`));
  const nx = document.createElement('button');
  nx.className = 'next'; nx.id = 'next';
  nx.textContent = quiz.i + 1 < quiz.qs.length ? '次の問題 →' : '結果を見る';
  nx.onclick = next;
  r.append(nx);
  $('qcard').append(r);
  quiz.i++; updateProgress(); quiz.i--;
  nx.focus({ preventScroll: true });
  r.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}
function factsHTML(c) {
  return `<div class="facts"><img src="${flag(c.a)}" alt="${esc(c.n)}の国旗"><dl>
    <dd class="name">${esc(c.n)}</dd>
    <dt>首都</dt><dd>${esc(c.c)}</dd>
    <dt>地域</dt><dd>${esc(c.r)}</dd>
    <dt>面積</dt><dd class="mono">${fmt(c.ar)} km²</dd>
    <dt>ISO</dt><dd class="mono">${c.a.toUpperCase()}</dd></dl></div>`;
}
function next() {
  quiz.i++;
  if (quiz.i < quiz.qs.length) { showQuestion(); window.scrollTo({ top: 0 }); return; }
  showResult();
}
function showResult() {
  const { qs, score, best, missed } = quiz;
  $('pbar').style.width = '100%';
  const msg = score === qs.length ? 'パーフェクト！' : score >= qs.length * .7 ? 'いい感じ！' : 'もう一回いってみよう';
  const box = $('qcard');
  box.innerHTML = `<div class="result"><p class="qlabel">${msg}</p><p class="score">${score}<small> / ${qs.length}</small></p><p class="qsub" style="margin:6px 0 0">最高連続正解 ${best}</p></div>
    ${missed.length ? `<p class="qlabel" style="font-size:1rem">まちがえた国</p><ul class="misslist">${missed.map(c => `<li><img src="${flag(c.a)}" alt=""><b>${esc(c.n)}</b><span>${esc(c.c)}</span></li>`).join('')}</ul>` : ''}
    <div class="row">${missed.length ? '<button class="ghost" id="retry-miss">まちがえた国だけ</button>' : ''}<button class="next" id="again" style="align-self:auto">もう一回</button></div>`;
  $('again').onclick = () => { renderSettings(); startRound(); };
  if (missed.length) $('retry-miss').onclick = () => startRound(missed);
  $('again').focus({ preventScroll: true });
}
document.addEventListener('keydown', e => {
  if ($('view-quiz').hidden || e.target.matches('input, select, textarea') || $('detail').open) return;
  if (/^[1-4]$/.test(e.key)) { const b = document.querySelectorAll('.choice')[+e.key - 1]; if (b && !b.disabled) b.click(); }
  if (e.key === 'Enter' && document.activeElement?.id !== 'next' && $('next')) $('next').click();
});

/* ---------- 図鑑 ---------- */
let bregion = 'all';
$('bregion').innerHTML = [['all', 'すべての地域'], ...REGIONS.map(r => [r, r])].map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
function renderBook() {
  const q = $('q').value.trim();
  const list = C.filter(c => (bregion === 'all' || c.r === bregion) && (!q || c.n.includes(q) || c.c.includes(q)))
    .sort((a, b) => a.n.localeCompare(b.n, 'ja'));
  $('bcount').textContent = `${list.length}か国`;
  $('grid').className = 'grid' + ($('hidecap').checked ? ' hide-cap' : '');
  $('grid').innerHTML = list.map(c => `<button class="card" data-a="${c.a}"><img loading="lazy" src="${flag(c.a)}" alt=""><b>${esc(c.n)}</b><span>首都 ${esc(c.c)}</span></button>`).join('');
}
$('q').oninput = renderBook;
$('bregion').onchange = e => { bregion = e.target.value; renderBook(); };
$('hidecap').onchange = renderBook;
$('grid').onclick = e => {
  const b = e.target.closest('.card'); if (!b) return;
  const c = byA.get(b.dataset.a), inner = $('detail-inner');
  inner.innerHTML = `<button class="close" id="dclose">閉じる</button>${factsHTML(c)}`;
  inner.append(mapSvg(c, `${c.n}の位置`));
  $('dclose').onclick = () => $('detail').close();
  $('detail').showModal();
};
$('detail').onclick = e => { if (e.target === $('detail')) $('detail').close(); };

/* ---------- タブ ---------- */
function showTab(t) {
  $('tab-quiz').setAttribute('aria-selected', t === 'quiz');
  $('tab-book').setAttribute('aria-selected', t === 'book');
  $('view-quiz').hidden = t !== 'quiz';
  $('view-book').hidden = t !== 'book';
  if (t === 'book' && !$('grid').children.length) renderBook();
  store.set('tab', t);
}
$('tab-quiz').onclick = () => showTab('quiz');
$('tab-book').onclick = () => showTab('book');

renderSettings();
startRound();
showTab(location.hash === '#book' ? 'book' : location.hash === '#quiz' ? 'quiz' : store.get('tab', 'quiz'));
</script>
</body>
</html>
