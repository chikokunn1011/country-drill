<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 国旗マスター: 国旗の4つの型（縦3色・十字・丸・横3色）を並べたタイル -->
  <rect width="512" height="512" rx="112" fill="#1b2a33"/>
  <defs>
    <clipPath id="t1"><rect x="64" y="64" width="180" height="180" rx="26"/></clipPath>
    <clipPath id="t2"><rect x="268" y="64" width="180" height="180" rx="26"/></clipPath>
    <clipPath id="t3"><rect x="64" y="268" width="180" height="180" rx="26"/></clipPath>
    <clipPath id="t4"><rect x="268" y="268" width="180" height="180" rx="26"/></clipPath>
  </defs>
  <!-- 縦3色 -->
  <g clip-path="url(#t1)"><rect x="64" y="64" width="60" height="180" fill="#1f5f8b"/><rect x="124" y="64" width="60" height="180" fill="#f4f6ef"/><rect x="184" y="64" width="60" height="180" fill="#c43d3d"/></g>
  <!-- 十字 -->
  <g clip-path="url(#t2)"><rect x="268" y="64" width="180" height="180" fill="#2e8b57"/><rect x="268" y="138" width="180" height="32" fill="#f4f6ef"/><rect x="316" y="64" width="32" height="180" fill="#f4f6ef"/></g>
  <!-- 丸 -->
  <g clip-path="url(#t3)"><rect x="64" y="268" width="180" height="180" fill="#f4f6ef"/><circle cx="154" cy="358" r="46" fill="#c43d3d"/></g>
  <!-- 横3色 -->
  <g clip-path="url(#t4)"><rect x="268" y="268" width="180" height="60" fill="#e39b2d"/><rect x="268" y="328" width="180" height="60" fill="#1b2a33"/><rect x="268" y="388" width="180" height="60" fill="#c43d3d"/></g>
</svg>
